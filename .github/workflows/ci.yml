name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required for the merge queue: a queued PR is built on a temporary
  # `gh-readonly-queue/...` ref that fires `merge_group`, not `pull_request`.
  # Without this the required `build` check never reports and every entry is
  # ejected on timeout.
  merge_group:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # setup-node v5+ turns caching on by itself when `package.json` has a
          # `packageManager` field, and that cache needs a lockfile. This repo
          # commits no lockfile on purpose (vitest/rollup pull cross-platform
          # optional deps), so the cache would fail to find one. Keep it off
          # explicitly rather than relying on `packageManager` staying absent.
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
