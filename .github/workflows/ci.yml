name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      release_tag:
        description: Version tag to stamp into the npm package, such as v1.8.0
        required: false
        type: string
        default: ''

# A new push makes an older run for the same PR irrelevant. Cancelling it saves
# minutes while still leaving the newest commit as the required `build` check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that changes only Markdown has nothing to compile or test,
  # so it skips `build`. GitHub counts a skipped job as passed, which keeps the
  # required `build` check satisfied. Markdown under plugins/ and
  # docs/decision-tables/ belongs to what the tests check, so it still builds.
  # A release call is not a pull request and always builds.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # A pull request is checked out as its merge commit: the first parent is
      # the base, so two commits are enough to list what the PR changes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect code changes
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT_NAME" = pull_request ]; then
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
            echo "$files"
            if [ -n "$files" ] \
              && ! grep -qvE '\.md$' <<<"$files" \
              && ! grep -qE '^(plugins|docs/decision-tables)/' <<<"$files"; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          # A manual release retry runs the current workflow from main while
          # rebuilding the immutable source tag that was originally pushed.
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # A release tag is the source of the published version. Stamp it only in
      # this disposable checkout; main stays at an unmistakable dev version.
      - name: Stamp release version
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The release job publishes this exact CI-built tarball instead of doing
      # another npm install and build on a second runner.
      - name: Pack npm release
        if: inputs.release_tag != ''
        run: |
          mkdir npm-package
          npm pack --pack-destination npm-package --ignore-scripts

      - name: Save npm release
        if: inputs.release_tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: npm-package/*.tgz
          if-no-files-found: error
          retention-days: 1
