name: Release

on:
  push:
    tags:
      - 'v*'
  # Re-run a dropped tag webhook against the tag without deleting a public tag.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Releases must pass the same required checks as pull requests. This call also
  # builds the npm tarball that the release job publishes unchanged.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.ref_name }}

  release:
    needs: ci
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::Release must run against a version tag, got $GITHUB_REF."
            exit 1
          fi

          VERSION=${RELEASE_TAG#v}
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$RELEASE_TAG is not a semantic version tag such as v1.8.0."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $RELEASE_TAG"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install locked binary dependencies
        run: bun install --frozen-lockfile

      - name: Build all platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            scripts/build-binary.sh "bun-$target" "bin/universal-netlist-$target"
          done
          scripts/build-binary.sh bun-windows-x64 bin/universal-netlist-windows-x64.exe

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Create macOS universal binary
        run: |
          cd bin
          lipo -create universal-netlist-darwin-arm64 universal-netlist-darwin-x64 \
            -output universal-netlist-darwin-universal
          lipo -info universal-netlist-darwin-universal

      - name: Sign macOS universal binary
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd bin
          codesign --force --options runtime --entitlements ../entitlements.plist \
            --sign "Developer ID Application: Valentino Zegna Baruffa ($APPLE_TEAM_ID)" \
            universal-netlist-darwin-universal
          codesign --verify --verbose universal-netlist-darwin-universal

      - name: Notarize macOS universal binary
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd bin
          zip universal-netlist-darwin-universal.zip universal-netlist-darwin-universal
          xcrun notarytool submit universal-netlist-darwin-universal.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          rm universal-netlist-darwin-universal.zip

      - name: Create arch-specific aliases for backward-compatible updates
        run: |
          cd bin
          cp universal-netlist-darwin-universal universal-netlist-darwin-arm64
          cp universal-netlist-darwin-universal universal-netlist-darwin-x64

      - name: Generate checksums
        run: |
          cd bin
          shasum -a 256 universal-netlist-* > checksums.txt
          cat checksums.txt

      - name: Build .mcpb desktop extension
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: RELEASE_DIR=$PWD/bin OUTPUT_DIR=$PWD/bin scripts/build-mcpb.sh "$VERSION"

      - name: Download CI-built npm package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package

      - name: Setup npm trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Update npm for OIDC
        run: npm install -g npm@latest

      # Publishing is idempotent so a retry can finish the GitHub Release after
      # npm succeeded without failing because that immutable version exists.
      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already published; continuing."
          else
            npm publish npm-package/*.tgz --provenance --access public --ignore-scripts
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            bin/universal-netlist-darwin-universal
            bin/universal-netlist-darwin-arm64
            bin/universal-netlist-darwin-x64
            bin/universal-netlist-linux-arm64
            bin/universal-netlist-linux-x64
            bin/universal-netlist-windows-x64.exe
            bin/checksums.txt
            bin/universal-netlist.mcpb
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
